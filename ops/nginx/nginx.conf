map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

upstream guniapa_frontend {
    server frontend:3000;
}

upstream guniapa_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1d;
        access_log off;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn connections_per_ip 30;
        proxy_pass http://guniapa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://guniapa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        limit_conn connections_per_ip 30;
        proxy_pass http://guniapa_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
